<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagma: Your files were waiting</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg">
<style>
/* Coconat and Absans by Collletttivo, SIL Open Font License 1.1 (fonts/OFL-Coconat.txt, fonts/OFL-Absans.txt). */
@font-face { font-family: "Coconat"; src: url("fonts/Coconat-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Absans"; src: url("fonts/Absans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
:root {
  --cream: #F6F1E7; --ink: #141413; --ink-2: #3D3B37; --mute: #6B675F;
  --orange: #EF7F42; --pink: #FC829A; --bubble: #F7B3C8; --green: #4FAF78; --mint: #BFE6C8; --yellow: #F5C842; --sky: #8FC1F0; --lilac: #C9B8F2; --red: #E4572E;
  --display: "Coconat", Georgia, serif; --body: "Absans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0E0E0D; color: var(--cream); font-family: var(--body); font-synthesis: none; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; }
.top { width: min(96vw, 1280px); display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #8d887c; font-size: 13px; }
.top b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--cream); white-space: nowrap; }
.top kbd { font: inherit; padding: 1px 6px; border: 1px solid #3a3833; border-radius: 6px; color: var(--cream); }
@media (max-width: 720px) { .top span { display: none; } }

/* The stage: 16:9, everything inside sized in cqw (1cqw = 1% of the stage width; the stage is 56.25cqw tall). */
.stage { position: relative; width: min(96vw, 1280px); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 18px; background: var(--cream); container-type: inline-size; cursor: pointer; user-select: none; box-shadow: 0 30px 80px -40px rgba(0,0,0,.9); }
.scene { position: absolute; inset: 0; opacity: 0; background: var(--cream); }
.scene > * { position: absolute; }
.over { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.over > * { position: absolute; }

/* Display type: Coconat, one weight. "Weight" comes from a squash, a cream/ink inversion or a stroke. */
.stamp { font-family: var(--display); font-weight: 400; letter-spacing: -.03em; line-height: .9; color: var(--ink); white-space: nowrap; }
.stamp .w { display: inline-block; opacity: 0; will-change: transform; }
.stamp .w.inv { background: var(--ink); color: var(--cream); padding: 0 .12em; border-radius: .12em; }
.outline { color: transparent; -webkit-text-stroke: .22cqw var(--ink); }
.type { font-family: var(--display); font-weight: 400; letter-spacing: -.03em; line-height: .95; color: var(--ink); white-space: nowrap; }
.type .w { display: inline-block; opacity: 0; }
/* Highlighter: the website's marker swipe (wobbly band, rough filter), wiped in left to right. */
.hl { position: relative; display: inline-block; white-space: nowrap; }
.hl .hlm { position: absolute; left: -0.12em; width: calc(100% + 0.24em); top: -6%; height: 112%; z-index: -1; overflow: visible; pointer-events: none; clip-path: inset(-20% 100% -20% 0); }
.hl .hlm path { fill: var(--hlc, var(--yellow)); opacity: .8; filter: url(#rough); }
.hl.pink { --hlc: var(--pink); } .hl.orange { --hlc: var(--orange); } .hl.sky { --hlc: var(--sky); } .hl.green { --hlc: var(--green); } .hl.mint { --hlc: var(--mint); } .hl.yellow { --hlc: var(--yellow); }

/* A window of the real app: the website's frame (ink border, hard offset shadow). The capture inside takes the camera. */
.win { border: .18cqw solid var(--ink); border-radius: 1.4cqw; overflow: hidden; background: #fff; box-shadow: .7cqw .7cqw 0 var(--ink); opacity: 0; will-change: transform; }
.win img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; transform-origin: 50% 50%; will-change: transform; }
.win .mask { position: absolute; background: #fff; will-change: clip-path; }
.cap { font-size: 1.3cqw; color: var(--ink); opacity: 0; white-space: nowrap; }
.tile { overflow: hidden; border: .18cqw solid var(--ink); border-radius: 1cqw; background: #fff; box-shadow: .5cqw .5cqw 0 var(--ink); opacity: 0; will-change: transform; }
.tile img { position: absolute; display: block; max-width: none; }
/* A flat object carried across a cut (the relay's morphs): a rounded block that scales from one shot's object to the next's. */
.carry { opacity: 0; border-radius: 1cqw; transform-origin: 0 0; will-change: transform; border: .18cqw solid var(--ink); box-shadow: .5cqw .5cqw 0 var(--ink); }

/* Stickers and pills: the website's. Coconat, ink border, hard shadow, popped in with a wobble. */
.stw { will-change: transform; }
.st { display: inline-block; padding: .75cqw 1.5cqw; border-radius: 999px; border: .18cqw solid var(--ink); font-family: var(--display); font-size: 1.8cqw; line-height: 1.2; color: var(--ink); background: var(--c, var(--cream)); box-shadow: .4cqw .4cqw 0 var(--ink); white-space: nowrap; opacity: 0; will-change: transform; }
.st.big2 { font-size: 2.6cqw; padding: 1cqw 2.2cqw; }
/* Named cursors: the website's crowd. */
.cc { display: flex; align-items: flex-start; opacity: 0; will-change: transform; z-index: 5; }
.cc svg { width: 1.9cqw; height: 1.9cqw; fill: var(--c); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; filter: drop-shadow(1px 2px 0 rgba(20,20,19,.25)); flex: none; }
.cc span { margin: 1.3cqw 0 0 -.5cqw; padding: .25cqw .8cqw; border-radius: 999px; background: var(--c); border: .12cqw solid var(--ink); font-family: var(--body); font-size: 1.05cqw; white-space: nowrap; color: var(--ink); }
.cc.plain svg { fill: #fff; stroke: #3D3B37; filter: drop-shadow(1px 2px 0 rgba(20,20,19,.3)); }
.ring { width: 3cqw; height: 3cqw; margin: -1.5cqw 0 0 -1.5cqw; border-radius: 50%; border: .25cqw solid var(--ink); opacity: 0; will-change: transform; }
/* Funny shapes: the website's sprite. */
.fun { opacity: 0; will-change: transform; }
.fun svg { display: block; width: 100%; height: 100%; fill: currentColor; overflow: visible; }

/* The website's loader (orange box pops, the cat climbs up inside it, the wordmark wipes in). */
.ld { display: flex; align-items: center; gap: 2cqw; will-change: transform; transform-origin: 0 0; }
.ld .box { position: relative; width: 14cqw; height: 14cqw; border-radius: 3.7cqw; background: var(--orange); overflow: hidden; isolation: isolate; opacity: 0; will-change: transform; }
.ld .box img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transform: translateY(105%); will-change: transform; }
.ld .wm { height: 8cqw; width: auto; display: block; clip-path: inset(-10% 100% -10% 0); }
.ld .wm svg { height: 100%; width: auto; display: block; fill: currentColor; }
.wmark { height: 9cqw; color: var(--ink); opacity: 0; will-change: transform; transform-origin: 50% 50%; }
.wmark svg { height: 100%; width: auto; display: block; fill: currentColor; }

/* The hook's desktop: a neutral, greyed OS-like window inside the website's frame. No product's look. */
.os { display: flex; flex-direction: column; width: 100%; height: 100%; background: #ECEAE4; color: #7a766d; font-family: var(--body); font-size: 1.05cqw; }
.os .bar { display: flex; align-items: center; gap: .6cqw; height: 3.2cqw; padding: 0 1.2cqw; background: #DEDBD3; border-bottom: .12cqw solid #CFCBC2; }
.os .bar i { width: .95cqw; height: .95cqw; border-radius: 50%; background: #C4C0B6; }
.os .bar b { margin-left: 1cqw; font-weight: 400; color: #5a564e; }
.os .body { display: flex; flex: 1; min-height: 0; }
.os .side { width: 15cqw; padding: 1.2cqw .8cqw; border-right: .12cqw solid #CFCBC2; background: #E4E1DA; display: flex; flex-direction: column; gap: .5cqw; }
.os .side span { padding: .45cqw .8cqw; border-radius: .5cqw; }
.os .side span.on { background: #CFCBC2; color: #3D3B37; }
.os .grid { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.4cqw 1cqw; padding: 1.6cqw 1.8cqw; align-content: start; }
.os .fi { display: flex; flex-direction: column; align-items: center; gap: .5cqw; text-align: center; font-size: .95cqw; color: #8d897f; }
.os .fi svg { width: 4cqw; height: 5cqw; display: block; }
.os .fi svg path { fill: #D5D1C8; stroke: #B9B5AB; stroke-width: 1.5; stroke-linejoin: round; }
.os .fi svg rect { fill: #C4C0B6; }
.os .fi.hot { color: #3D3B37; }
.os .fi.hot svg path { fill: #CBC7BE; }
.tip { padding: .5cqw .9cqw; border-radius: .5cqw; background: #3D3B37; color: #ECEAE4; font-size: 1.05cqw; white-space: nowrap; opacity: 0; will-change: transform; }
.modal { width: 34cqw; padding: 2.4cqw 2.4cqw 2cqw; border-radius: 1.2cqw; background: #FAF9F6; color: #2b2925; box-shadow: 0 2cqw 4cqw -1cqw rgba(0,0,0,.35); font-family: var(--body); opacity: 0; will-change: transform; transform-origin: 50% 50%; }
.modal b { display: block; font-weight: 400; font-size: 2.2cqw; letter-spacing: -.01em; margin-bottom: 1.8cqw; }
.modal .btns { display: flex; gap: .8cqw; justify-content: flex-end; }
.modal .btns span { padding: .7cqw 1.6cqw; border-radius: .6cqw; font-size: 1.15cqw; background: #E6E3DC; color: #5a564e; }
.modal .btns span.go { background: #3D3B37; color: #F6F1E7; }
.wash { inset: 0; background: #9a968c; opacity: 0; mix-blend-mode: saturation; }
.flood { inset: -2%; opacity: 0; will-change: clip-path; }
/* The cat's paw: flat, the insignia's black with its pink pads. */
.paw { width: 44cqw; height: auto; opacity: 0; will-change: transform; transform-origin: 100% 50%; }
.paw svg { display: block; width: 100%; height: auto; overflow: visible; }
/* The peeking cat and its wink: the insignia, with one eye shut by a lid and a happy arc. */
.peek { width: 18cqw; height: 18cqw; opacity: 0; will-change: transform; }
.peek img { width: 100%; height: 100%; display: block; }
.peek .lid { position: absolute; left: 59.5%; top: 41.5%; width: 13.5%; height: 14%; border-radius: 50%; background: #000; transform: scaleY(0); transform-origin: 50% 50%; will-change: transform; }
.peek .arc { position: absolute; left: 59.5%; top: 44%; width: 13.5%; height: 8%; border: .35cqw solid #F6F1E7; border-top: 0; border-radius: 0 0 100px 100px; opacity: 0; }

/* The repo card and the download buttons: the website's pills and buttons. */
.repo { width: 40cqw; padding: 2.2cqw 2.4cqw; border-radius: 1.6cqw; background: var(--cream); border: .18cqw solid var(--ink); box-shadow: .8cqw .8cqw 0 var(--ink); color: var(--ink); font-family: var(--body); opacity: 0; will-change: transform; transform-origin: 50% 100%; }
.repo .nm { display: flex; align-items: center; gap: .9cqw; font-family: var(--display); font-size: 2.4cqw; letter-spacing: -.02em; }
.repo .nm svg { width: 2.2cqw; height: 2.2cqw; flex: none; }
.repo p { margin: 1cqw 0 1.6cqw; font-size: 1.25cqw; color: var(--ink-2); }
.repo .row { display: flex; gap: .9cqw; align-items: center; }
.repo .pill { display: inline-flex; align-items: center; gap: .5cqw; padding: .55cqw 1.1cqw; border-radius: 999px; border: .15cqw solid var(--ink); font-family: var(--display); font-size: 1.3cqw; background: var(--c, #fff); box-shadow: .3cqw .3cqw 0 var(--ink); }
.repo .pill svg { width: 1.2cqw; height: 1.2cqw; }
.repo .fork { margin-left: auto; }
.dl { display: inline-flex; align-items: center; justify-content: center; gap: .6cqw; height: 5.2cqw; padding: 0 2.6cqw; border-radius: 999px; border: .2cqw solid var(--ink); background: var(--c, var(--cream)); color: var(--ink); font-family: var(--display); font-size: 2.1cqw; box-shadow: .5cqw .5cqw 0 var(--ink); white-space: nowrap; opacity: 0; will-change: transform; }

/* The player. */
.player { width: min(96vw, 1280px); display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 999px; background: #1e1d1b; }
.player button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--cream); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.player button:hover { background: var(--orange); }
.player button svg { width: 18px; height: 18px; fill: currentColor; }
.time { font-variant-numeric: tabular-nums; font-size: 14px; color: #B9B4A8; min-width: 92px; }
.scrub { position: relative; height: 40px; display: flex; align-items: center; }
.scrub input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
.track { position: relative; width: 100%; height: 8px; border-radius: 999px; background: #33312d; overflow: hidden; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--orange); }
.track em { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(246,241,231,.25); }
.chapters { width: min(96vw, 1280px); display: flex; flex-wrap: wrap; gap: 8px; }
.chapters button { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid #3a3833; background: transparent; color: #B9B4A8; cursor: pointer; }
.chapters button:hover, .chapters button.on { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.hint { width: min(96vw, 1280px); color: #7d786e; font-size: 12px; }
.start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(246,241,231,.5); z-index: 30; }
.start div { padding: 1.1cqw 2.6cqw; border-radius: 999px; background: var(--ink); color: var(--cream); font-family: var(--display); font-size: 2.2cqw; border: .18cqw solid var(--ink); box-shadow: .5cqw .5cqw 0 var(--orange); }
@media (max-width: 600px) { .player { gap: 8px; padding: 8px 10px; } .time { min-width: 0; font-size: 12px; } .player button { width: 34px; height: 34px; } .hint { display: none; } }
</style>

// ---- The clock, and every animation on it ----
// 124 BPM, swung. Every cut sits on a beat: b(n) is the time of beat n; a bar is four beats (about 1.9 s).
const BPM = 124, BEAT = 60 / BPM, b = (n) => n * BEAT;
const DURATION = 55;
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stage = document.getElementById("stage");
const ANIMS = [];

const EASE = "cubic-bezier(.2,.8,.2,1)", SNAP = "cubic-bezier(.3,.7,.2,1)", POP = "cubic-bezier(.2,1.25,.3,1)", HARD = "cubic-bezier(.5,0,.8,.4)";
const CUT = 0.26; // the longest transition: eight frames at 30 fps
function anim(el, frames, { at, dur, ease = EASE, fill = "both", layout = false }) {

const el = (tag, cls, html = "", style = "") => { const e = document.createElement(tag); if (cls) e.className = cls; e.innerHTML = html; if (style) e.style.cssText = style; return e; };
const SCENES = [];
// A scene is one flat colour with everything on it; it cuts in and out hard (no crossfades).
function scene(name, at, end, bg, build) {
  const s = el("div", "scene");
  s.style.background = bg;
  stage.appendChild(s);
  anim(s, [{ opacity: 0 }, { opacity: 1 }], { at: at - 0.01, dur: 0.02, ease: "linear" });
  anim(s, [{ opacity: 1 }, { opacity: 0 }], { at: end, dur: 0.02, ease: "linear", fill: "forwards" });

}
// Things that cross a cut (the relay's carried objects, the paw) live above every scene.
const OVER = el("div", "over"); stage.appendChild(OVER);
const SFX = []; const sfx = (t, kind) => SFX.push([t, kind]);
const IMG = "img/reel/";                 // the captures (1440x856)
const LOOPS = IMG.replace("reel/", "");  // the loop posters (1440x900)
const CURSOR = '<svg viewBox="0 0 24 24"><path d="M4 3l16 7.5-7.2 1.8L10 20z"/></svg>';
const HLM = '<svg class="hlm" viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true"><path d="M4 16 C 40 8, 90 12, 130 9 S 186 4, 197 12 C 200 40, 198 66, 195 92 C 150 88, 100 96, 60 93 S 14 98, 5 90 C 1 64, 2 40, 4 16 Z"/></svg>';
const SH = 56.25; // the stage's height in cqw
// The camera on a capture: scale z about the point (fx%, fy%) of it, bringing that point to the middle of the window.
const cam = (z, fx, fy) => `translate(${(z * (50 - fx)).toFixed(2)}%, ${(z * (50 - fy)).toFixed(2)}%) scale(${z})`;
// Where a point of the capture (px, py in its 1440x856 pixels) lands on the stage under a window's camera.
const AR = 1440 / 856;
function at(win, [z, fx, fy], px, py) { const W = win.w, H = win.w / AR; return [win.x + W * (0.5 + z * (px / 1440 - fx / 100)), win.y + H * (0.5 + z * (py / 856 - fy / 100))]; }

// A window of the real app, snapping in on its beat. keys: the camera's path, [[time, z, fx, fy], ...] (held between keys, moved with SNAP).
function snap(s, name, { at: t0, out, x = 12, y = 6.4, w = 76, keys = [[t0, 1, 50, 50]], pop = true, rot = 0, mask = null }) {
  const win = el("div", "win", '<img alt="" width="1440" height="856">', `left:${x}cqw;top:${y}cqw;width:${w}cqw;height:${(w / AR).toFixed(2)}cqw`);
  win.querySelector("img").src = IMG + name + ".webp";
  s.appendChild(win);
  anim(win, [{ opacity: 0 }, { opacity: 1 }], { at: t0, dur: 0.02, ease: "linear" });
  if (pop) anim(win, [{ transform: `translateY(3cqw) scale(.86) rotate(${rot - 2}deg)` }, { transform: `rotate(${rot}deg)` }], { at: t0, dur: 0.45, ease: POP });
  const img = win.querySelector("img");
  const end = out ?? t0 + 3;
  // The camera: a keyframe list with holds, so each move is its own snappy push.
  const ks = keys.map(([t, z, fx, fy]) => ({ t, tr: cam(z, fx, fy) }));
  const frames = [];
  const span = end - t0 + 0.3;
  ks.forEach((k, i) => {
    const t = Math.max(t0, k.t);
    if (i > 0) frames.push({ transform: ks[i - 1].tr, offset: Math.min(1, (t - t0) / span), easing: SNAP });

    if (i > 0) sfx(t, "click");
  });

  frames[0].offset = 0;
  anim(img, frames, { at: t0, dur: span, ease: "linear" });
  if (out != null) anim(win, [{ opacity: 1 }, { opacity: 0 }], { at: out, dur: 0.02, ease: "linear", fill: "forwards" });

  win.w = w; win.x = x; win.y = y; win.img = img;
  return win;
}
// A crop of a capture or poster as its own tile. Crop in source pixels; sw is the source width.
function tile(s, src, sw, [cx, cy, cw, chh], { at: t0, out, x, y, w, rot = 0, pop = true }) {
  const h = (w * chh) / cw;
  const t = el("div", "tile", '<img alt="">', `left:${x}cqw;top:${y}cqw;width:${w}cqw;height:${h.toFixed(2)}cqw`);
  const img = t.querySelector("img"); img.src = src;
  const k = w / cw; img.style.width = (sw * k).toFixed(2) + "cqw"; img.style.left = (-cx * k).toFixed(2) + "cqw"; img.style.top = (-cy * k).toFixed(2) + "cqw";
  s.appendChild(t);
  anim(t, [{ opacity: 0 }, { opacity: 1 }], { at: t0, dur: 0.02, ease: "linear" });
  if (pop) anim(t, [{ transform: `scale(.6) rotate(${rot - 8}deg)` }, { transform: `rotate(${rot}deg)` }], { at: t0, dur: 0.45, ease: POP });
  if (out != null) anim(t, [{ opacity: 1 }, { opacity: 0 }], { at: out, dur: 0.02, fill: "forwards" });
  sfx(t0, "pop");
  t.h = h;
  return t;
}
// A flat block that is one shot's object and becomes the next shot's: shown for `dur` across the cut, scaling from one rect to the other.
function carry({ at: t0, dur = CUT, from, to, color }) {
  const c = el("div", "carry", "", `left:${from[0]}cqw;top:${from[1]}cqw;width:${from[2]}cqw;height:${from[3]}cqw;background:${color}`);
  OVER.appendChild(c);
  anim(c, [{ opacity: 0 }, { opacity: 1 }], { at: t0, dur: 0.02, ease: "linear" });
  anim(c, [{ transform: "none" }, { transform: `translate(${to[0] - from[0]}cqw, ${to[1] - from[1]}cqw) scale(${to[2] / from[2]}, ${to[3] / from[3]})` }], { at: t0, dur, ease: SNAP, layout: true });
  anim(c, [{ opacity: 1 }, { opacity: 0 }], { at: t0 + dur, dur: 0.02, ease: "linear", fill: "forwards" });
  sfx(t0, "whoosh");
  return c;
}
// A sticker (pill) popping in at (x, y) with the website's wobble. c: a colour variable name.
function sticker(s, text, { at: t0, out = null, x, y, c = "cream", rot = -3, big = false, kind = "pop" }) {
  const w = el("div", "stw", `<span class="st${big ? " big2" : ""}" style="--c:var(--${c})">${text}</span>`, `left:${x}cqw;top:${y}cqw;transform:translate(-50%,-50%)`);
  s.appendChild(w);
  const st = w.firstChild;
  anim(st, [{ opacity: 0 }, { opacity: 1 }], { at: t0, dur: 0.02, ease: "linear" });
  anim(st, [{ transform: "scale(0) rotate(-20deg)", offset: 0 }, { transform: `scale(1.1) rotate(${rot + 3}deg)`, offset: 0.7 }, { transform: `scale(1) rotate(${rot}deg)`, offset: 1 }], { at: t0, dur: 0.5, ease: EASE });
  if (out != null) anim(st, [{ opacity: 1 }, { opacity: 0 }], { at: out, dur: 0.02, fill: "forwards" });
  if (kind) sfx(t0, kind);
  return w;
}
// A cursor (named, or plain for the hook's desktop) moving through timed points [[t, x, y], ...], clicking at the times in `clicks`.
function cursor(s, name, c, pts, { out = null, clicks = [], plain = false, double = [] }) {
  const t0 = pts[0][0], t1 = out ?? pts[pts.length - 1][0];
  const d = el("div", `cc${plain ? " plain" : ""}`, `${CURSOR}${name ? `<span>${name}</span>` : ""}`, `left:0;top:0;--c:var(--${c})`);
  s.appendChild(d);
  anim(d, [{ opacity: 0 }, { opacity: 1 }], { at: t0, dur: 0.05, ease: "linear" });
  const span = t1 - t0 || 0.01;
  anim(d, pts.map(([t, x, y]) => ({ transform: `translate(${x}cqw, ${y}cqw)`, offset: Math.min(1, Math.max(0, (t - t0) / span)), easing: "cubic-bezier(.45,.05,.55,.95)" })), { at: t0, dur: span, ease: "linear", layout: true });
  if (out != null) anim(d, [{ opacity: 1 }, { opacity: 0 }], { at: out, dur: 0.02, fill: "forwards" });
  const press = (t) => {
    const [, x, y] = pts.reduce((best, p) => (p[0] <= t ? p : best), pts[0]);
    const r = el("div", "ring", "", `left:${x}cqw;top:${y}cqw;border-color:${plain ? "#3D3B37" : "var(--ink)"}`); s.appendChild(r);
    anim(r, [{ opacity: 1, transform: "scale(.2)" }, { opacity: 0, transform: "scale(1)" }], { at: t, dur: 0.3, ease: EASE, fill: "forwards" });
    anim(d, [{ transform: `translate(${x}cqw, ${y}cqw) scale(1)`, offset: 0 }, { transform: `translate(${x}cqw, ${y}cqw) scale(.8)`, offset: 0.5 }, { transform: `translate(${x}cqw, ${y}cqw) scale(1)`, offset: 1 }], { at: t, dur: 0.12, ease: EASE, fill: "none" });

}
// A funny shape from the sprite. Pops in, then drifts and turns very slowly (ambient; doesn't count as a mover).
function shape(s, id, { at: t0, out = null, x, y, w, ar = 1, color = "var(--orange)", rot = 0, drift = 2 }) {
  const d = el("div", "fun", "<svg><use/></svg>", `left:${x}cqw;top:${y}cqw;width:${w}cqw;height:${(w / ar).toFixed(2)}cqw;color:${color}`);
  d.querySelector("use").setAttribute("href", "#" + id);
  s.appendChild(d);
  anim(d, [{ opacity: 0 }, { opacity: 1 }], { at: t0, dur: 0.02, ease: "linear" });
  anim(d, [{ transform: `scale(.3) rotate(${rot - 40}deg)`, offset: 0 }, { transform: `scale(1.06) rotate(${rot + 4}deg)`, offset: 0.65 }, { transform: `scale(1) rotate(${rot}deg)`, offset: 0.8 }, { transform: `translate(${drift}cqw, ${-drift * 0.6}cqw) rotate(${rot + 12}deg) scale(1)`, offset: 1 }], { at: t0, dur: 6, ease: "linear" });

}
// A shape tumbling in from above and landing (a bounce) where it is placed: the colour flood's pile. Skipped when motion is reduced.
function tumble(s, id, { at: t0, out = null, x, y, w, ar = 1, color, rot = 0 }) {
  if (REDUCE) return shape(s, id, { at: t0, out, x, y, w, ar, color, rot });
  const d = el("div", "fun", "<svg><use/></svg>", `left:${x}cqw;top:${y}cqw;width:${w}cqw;height:${(w / ar).toFixed(2)}cqw;color:${color}`);
  d.querySelector("use").setAttribute("href", "#" + id);
  s.appendChild(d);
  anim(d, [{ opacity: 0 }, { opacity: 1 }], { at: t0, dur: 0.02, ease: "linear" });
  anim(d, [
    { transform: `translateY(-70cqw) rotate(${rot - 200}deg)`, offset: 0, easing: "cubic-bezier(.45,0,1,1)" },
    { transform: `translateY(0) rotate(${rot - 14}deg)`, offset: 0.62, easing: "cubic-bezier(0,0,.4,1)" },
    { transform: `translateY(-3cqw) rotate(${rot - 4}deg)`, offset: 0.8, easing: "cubic-bezier(.45,0,1,1)" },
    { transform: `translateY(0) rotate(${rot}deg)`, offset: 1 },
  ], { at: t0, dur: 0.9, ease: "linear" });
  if (out != null) anim(d, [{ opacity: 1 }, { opacity: 0 }], { at: out, dur: 0.02, fill: "forwards" });
  sfx(t0 + 0.56, "thud");
  return d;
}
// Stamped words: each word slams in (squashed wide, then settling), one per `stagger`. hl marks the highlighted word, inv the inverted ("bold") words.
function stamp(s, text, { at: t0, x, y, size, stagger = 0.2, hl = null, hlc = "pink", fg = "var(--ink)", outline = null, out = null, inv = [], sound = "stamp", w = null }) {
  const h = el("div", "stamp", "", `left:${x}cqw;top:${y}cqw;font-size:${size}cqw;color:${fg}${w ? `;width:${w}cqw;white-space:normal` : ""}`);

    let inner = word;
    if (outline && word.toLowerCase().startsWith(outline)) inner = `<span class="outline">${word.slice(0, outline.length)}</span>${word.slice(outline.length)}`;
    const w = el("span", "w" + (inv.includes(i) ? " inv" : ""), inner + (i < words.length - 1 ? "&nbsp;" : ""));

function typeOn(s, text, { at: t0, x, y, size, per = 0.22, fg = "var(--ink)", out = null }) {

const fmt = (x) => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, "0")}`;

  const ci = chapterIndex(t);
  document.querySelectorAll("#chapters button").forEach((bt, i) => bt.classList.toggle("on", i === ci));
  if (fromUser) audio.resync();
}
function tick(now) {

}

startEl.onclick = (e) => { e.stopPropagation(); play(); };
// For the recorder and for scripts: the clock, exposed.
window.reel = { seek: (x) => seek(x, true), play, pause, get duration() { return DURATION; }, get time() { return t; } };
