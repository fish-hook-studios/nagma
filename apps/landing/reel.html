<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagma reel</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg">
<style>
@font-face { font-family: "Coconat"; src: url("fonts/Coconat-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Absans"; src: url("fonts/Absans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
:root {
  --cream: #F6F1E7; --ink: #141413; --ink-2: #3D3B37; --mute: #6B675F;
  --orange: #EF7F42; --pink: #FC829A; --green: #4FAF78; --mint: #BFE6C8; --yellow: #F5C842; --sky: #8FC1F0; --lilac: #C9B8F2;
  --display: "Coconat", Georgia, serif; --body: "Absans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0E0E0D; color: var(--cream); font-family: var(--body); font-synthesis: none; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; }
.top { width: min(96vw, 1280px); display: flex; justify-content: space-between; align-items: center; color: #8d887c; font-size: 13px; }
.top b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--cream); }
.top kbd { font: inherit; padding: 1px 6px; border: 1px solid #3a3833; border-radius: 6px; color: var(--cream); }

/* The stage: 16:9, sizes in cqw so it scales with the window. */
.stage { position: relative; width: min(96vw, 1280px); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 18px; background: var(--ink); container-type: inline-size; cursor: pointer; user-select: none; box-shadow: 0 30px 80px -40px rgba(0,0,0,.9); }
.scene { position: absolute; inset: 0; opacity: 0; }
.scene > * { position: absolute; }
.h { font-family: var(--display); font-weight: 400; line-height: .98; letter-spacing: -.02em; color: var(--cream); }
.h .w { display: inline-block; white-space: pre; opacity: 0; }
.h .u { position: relative; }
.h .u i { position: absolute; left: 0; right: .25em; bottom: .02em; height: .14em; background: var(--orange); transform-origin: left; transform: scaleX(0); border-radius: .04em; z-index: -1; }
.sub { font-size: 2cqw; color: #B9B4A8; opacity: 0; line-height: 1.4; }
.chapter { left: 6cqw; top: 3.2cqw; font-size: 1.1cqw; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); opacity: 0; }
.chapter b { font-weight: 400; color: #8d887c; margin-left: 1cqw; letter-spacing: .14em; }

/* A real frame of the app: the capture, in a thin window, with a slow camera. */
.shotwin { left: 7cqw; top: 12cqw; width: 86cqw; aspect-ratio: 1440 / 856; border-radius: 1cqw; overflow: hidden; border: .12cqw solid rgba(246,241,231,.18); box-shadow: 0 2cqw 5cqw -2cqw rgba(0,0,0,.8); opacity: 0; background: #1b1a18; }
.shotwin img { display: block; width: 100%; height: 100%; transform-origin: 50% 50%; will-change: transform; }

/* Callouts: a dot on the real UI, a line, and a small label. */
.co { width: 0; height: 0; opacity: 0; z-index: 6; }
.co i { position: absolute; left: -.55cqw; top: -.55cqw; width: 1.1cqw; height: 1.1cqw; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 .3cqw rgba(239,127,66,.35); transform: scale(0); }
.co svg { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
.co svg line { stroke: var(--orange); stroke-width: 2px; stroke-dasharray: 400; stroke-dashoffset: 400; }
.co span { position: absolute; white-space: nowrap; padding: .55cqw .95cqw; border-radius: .5cqw; background: var(--cream); color: var(--ink); font-size: 1.25cqw; line-height: 1.3; opacity: 0; box-shadow: 0 .4cqw 1.4cqw rgba(0,0,0,.35); }
.co span b { font-weight: 400; color: var(--orange); }

.mark { opacity: 0; }
.mark img { width: 100%; height: 100%; }
.sh { opacity: 0; }
.sh svg { width: 100%; height: 100%; fill: currentColor; overflow: visible; }
.cta { font-family: var(--display); font-size: 2.6cqw; color: var(--ink); background: var(--cream); padding: 1.3cqw 3cqw; border-radius: 999px; opacity: 0; }

/* The player. */
.player { width: min(96vw, 1280px); display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 999px; background: #1e1d1b; }
.player button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--cream); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.player button:hover { background: var(--orange); }
.player button svg { width: 18px; height: 18px; fill: currentColor; }
.time { font-variant-numeric: tabular-nums; font-size: 14px; color: #B9B4A8; min-width: 92px; }
.scrub { position: relative; height: 40px; display: flex; align-items: center; }
.scrub input { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; }
.track { position: relative; width: 100%; height: 8px; border-radius: 999px; background: #33312d; overflow: hidden; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--orange); }
.track em { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(246,241,231,.25); }
.chapters { width: min(96vw, 1280px); display: flex; flex-wrap: wrap; gap: 8px; }
.chapters button { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid #3a3833; background: transparent; color: #B9B4A8; cursor: pointer; }
.chapters button:hover, .chapters button.on { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.hint { width: min(96vw, 1280px); color: #7d786e; font-size: 12px; }
.start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(14,14,13,.45); z-index: 30; }
.start div { padding: 1.1cqw 2.6cqw; border-radius: 999px; background: var(--cream); color: var(--ink); font-family: var(--display); font-size: 2.2cqw; }
</style>
</head>
<body>
<div class="top"><b>Nagma reel · cut 2</b><span><kbd>Space</kbd> play · <kbd>←</kbd> <kbd>→</kbd> 2 s · <kbd>⇧</kbd>+arrows 10 s · <kbd>0</kbd>–<kbd>9</kbd> jump · <kbd>M</kbd> mute</span></div>

<div class="stage" id="stage">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="sh-sparkle" viewBox="0 0 100 100"><path d="M50 0c4 28 18 42 50 50-32 8-46 22-50 50-4-28-18-42-50-50 32-8 46-22 50-50z"/></symbol>
    <symbol id="sh-asterisk" viewBox="0 0 100 100"><path d="M43 0h14v34l30-17 7 12-30 17 30 17-7 12-30-17v34H43V66L13 83l-7-12 30-17L6 37l7-12 30 17z"/></symbol>
    <symbol id="sh-flower" viewBox="0 0 100 100"><path d="M50 4c9 0 15 7 16 14 7-3 16-1 20 6s2 16-4 21c6 5 8 14 4 21s-13 9-20 6c-1 7-7 14-16 14s-15-7-16-14c-7 3-16 1-20-6s-2-16 4-21c-6-5-8-14-4-21s13-9 20-6C35 11 41 4 50 4z"/></symbol>
  </svg>
  <div class="start" id="start"><div>Play the reel</div></div>
</div>

<div class="player">
  <button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg></button>
  <span class="time" id="time">0:00 / 0:00</span>
  <div class="scrub"><div class="track"><i id="fill"></i></div><input id="range" type="range" min="0" max="100" step="0.01" value="0" aria-label="Scrub"></div>
  <button id="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 8a4.5 4.5 0 0 1 0 8v-2a2.5 2.5 0 0 0 0-4zM16 4a8 8 0 0 1 0 16v-2a6 6 0 0 0 0-12z"/></svg></button>
  <button id="restart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.3 4H3.5A9 9 0 1 0 12 3V0L7 4l5 4z"/></svg></button>
</div>
<div class="chapters" id="chapters"></div>
<div class="hint">Every frame of the app is a full-resolution capture of the real Nagma UI; everything around it is HTML on one clock, so scrubbing is exact. Music and sounds are synthesised in the page.</div>

<script>
// ---- The clock, and every animation on it ----
const stage = document.getElementById("stage");
const ANIMS = [];
const EASE = "cubic-bezier(.2,.8,.2,1)", SOFT = "cubic-bezier(.25,.1,.25,1)";
function anim(el, frames, { at, dur, ease = EASE, fill = "both" }) {
  const a = el.animate(frames, { delay: at * 1000, duration: Math.max(1, dur * 1000), easing: ease, fill });
  a.pause(); ANIMS.push(a); return a;
}
const el = (tag, cls, html = "", style = "") => { const e = document.createElement(tag); if (cls) e.className = cls; e.innerHTML = html; if (style) e.style.cssText = style; return e; };
const SCENES = [];
function scene(name, at, end, build) {
  const s = el("div", "scene");
  stage.appendChild(s);
  anim(s, [{ opacity: 0 }, { opacity: 1 }], { at: at - 0.04, dur: 0.08, ease: "linear" });
  anim(s, [{ opacity: 1 }, { opacity: 0 }], { at: end, dur: 0.08, ease: "linear", fill: "forwards" });
  SCENES.push({ name, at, end, node: s });
  build(s, at, end);
  return s;
}
const SFX = []; const sfx = (t, kind) => SFX.push([t, kind]);
// A line of display type: the words rise in one after another; `u` underlines one word in orange.
function line(s, text, { at, size = 7, x = 6, y = 10, color = "var(--cream)", stagger = 0.07, u = null, width = "", out = null }) {
  const h = el("div", "h", "", `left:${x}cqw;top:${y}cqw;font-size:${size}cqw;color:${color};${width ? "width:" + width + "cqw" : ""}`);
  text.split(" ").forEach((word, i) => {
    let w;
    if (u && word.replace(/[.,!?]/g, "") === u) { w = el("span", "w u", `<i></i>${word} `); anim(w.querySelector("i"), [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { at: at + i * stagger + 0.4, dur: 0.5 }); }
    else w = el("span", "w", word + " ");
    h.appendChild(w);
    anim(w, [{ opacity: 0, transform: "translateY(.35em)" }, { opacity: 1, transform: "none" }], { at: at + i * stagger, dur: 0.6, ease: EASE });
  });
  if (out != null) anim(h, [{ opacity: 1 }, { opacity: 0, transform: "translateY(-.3cqw)" }], { at: out, dur: 0.4, fill: "forwards" });
  s.appendChild(h);
  sfx(at, "tick");
  return h;
}
function sub(s, text, { at, x = 6, y = 40, size = 2, w = 0, out = null, color = "" }) {
  const c = el("div", "sub", text, `left:${x}cqw;top:${y}cqw;font-size:${size}cqw;${w ? "width:" + w + "cqw;" : ""}${color ? "color:" + color : ""}`);
  s.appendChild(c);
  anim(c, [{ opacity: 0, transform: "translateY(.6cqw)" }, { opacity: 1, transform: "none" }], { at, dur: 0.6 });
  if (out != null) anim(c, [{ opacity: 1 }, { opacity: 0 }], { at: out, dur: 0.3, fill: "forwards" });
  return c;
}
function chapter(s, n, text, at) {
  const c = el("div", "chapter", `${n} <b>${text}</b>`);
  s.appendChild(c);
  anim(c, [{ opacity: 0, transform: "translateY(-.5cqw)" }, { opacity: 1, transform: "none" }], { at, dur: 0.5 });
  return c;
}
// A capture of the real app, arriving from below, with a slow push in toward a point (in capture pixels).
const SHOT_TOP = 12;
function shot(s, name, { at, out = null, focus = null, zoom = 1.06, dur = 6 }) {
  const w = el("div", "shotwin", '<img alt="" width="1440" height="856">');
  w.querySelector("img").src = "img/reel/" + name + ".webp";
  s.appendChild(w);
  anim(w, [{ opacity: 0, transform: "translateY(3cqw) scale(.985)" }, { opacity: 1, transform: "none" }], { at, dur: 0.7, ease: EASE });
  const img = w.querySelector("img");
  if (focus) img.style.transformOrigin = `${(focus[0] / 1440) * 100}% ${(focus[1] / 856) * 100}%`;
  anim(img, [{ transform: "scale(1)" }, { transform: `scale(${zoom})` }], { at: at + 0.2, dur, ease: SOFT });
  if (out != null) anim(w, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-1.5cqw) scale(1.01)" }], { at: out, dur: 0.4, ease: "ease-in", fill: "forwards" });
  sfx(at, "whoosh");
  return w;
}
// A callout on the capture at (px, py) in capture pixels (as captured, before the camera), its label offset by (dx, dy) cqw.
function callout(s, text, px, py, dx, dy, { at, out = null }) {
  const x = 7 + (px / 1440) * 86, y = SHOT_TOP + (py / 1440) * 86;
  const c = el("div", "co", `<i></i><svg><line x1="0" y1="0" x2="0" y2="0"/></svg><span>${text}</span>`, `left:${x}cqw;top:${y}cqw`);
  s.appendChild(c);
  const ln = c.querySelector("line");
  const sp = c.querySelector("span"); sp.style.left = dx + "cqw"; sp.style.top = dy + "cqw";
  const tx = dx < 0 ? "-100%" : "0", ty = dy < 0 ? "-100%" : "0";
  sp.style.transform = `translate(${tx}, ${ty})`;
  // The line's end in pixels, from the stage's width (cqw).
  const px2 = () => { const W = stage.clientWidth / 100; ln.setAttribute("x2", dx * W); ln.setAttribute("y2", dy * W); };
  px2(); addEventListener("resize", px2);
  anim(c, [{ opacity: 0 }, { opacity: 1 }], { at, dur: 0.15, ease: "linear" });
  anim(c.querySelector("i"), [{ transform: "scale(0)" }, { transform: "scale(1)" }], { at, dur: 0.4, ease: "cubic-bezier(.34,1.56,.64,1)" });
  anim(ln, [{ strokeDashoffset: 400 }, { strokeDashoffset: 0 }], { at: at + 0.1, dur: 0.35 });
  anim(sp, [{ opacity: 0, transform: `translate(${tx}, ${ty}) translateY(.4cqw)` }, { opacity: 1, transform: `translate(${tx}, ${ty})` }], { at: at + 0.3, dur: 0.4 });
  if (out != null) anim(c, [{ opacity: 1 }, { opacity: 0 }], { at: out, dur: 0.25, fill: "forwards" });
  sfx(at + 0.05, "blip");
  return c;
}
function mark(s, src, { at, x, y, w, out = null }) {
  const m = el("div", "mark", "<img alt=\"\">", `left:${x}cqw;top:${y}cqw;width:${w}cqw`);
  m.querySelector("img").src = src;
  s.appendChild(m);
  anim(m, [{ opacity: 0, transform: "translateY(1.2cqw) scale(.94)" }, { opacity: 1, transform: "none" }], { at, dur: 0.7, ease: EASE });
  if (out != null) anim(m, [{ opacity: 1 }, { opacity: 0 }], { at: out, dur: 0.4, fill: "forwards" });
  return m;
}
function accent(s, id, { at, x, y, size = 6, color = "var(--orange)", spin = 0 }) {
  const d = el("div", "sh", "<svg><use/></svg>", `left:${x}cqw;top:${y}cqw;width:${size}cqw;height:${size}cqw;color:${color}`);
  d.querySelector("use").setAttribute("href", "#" + id);
  s.appendChild(d);
  anim(d, [{ opacity: 0, transform: "scale(.4) rotate(-30deg)" }, { opacity: 1, transform: `scale(1) rotate(${spin}deg)` }], { at, dur: 0.7, ease: "cubic-bezier(.34,1.4,.64,1)" });
  anim(d, [{ transform: `scale(1) rotate(${spin}deg)` }, { transform: `scale(1) rotate(${spin + 25}deg)` }], { at: at + 0.7, dur: 12, ease: "linear" });
  return d;
}
// One capture with its line of copy: in at `t`, out after `dur`.
function beat(s, name, text, t, dur, focus, extra) {
  const w = shot(s, name, { at: t, out: t + dur, focus, zoom: 1.08, dur: dur + 0.4 });
  line(s, text, { at: t + 0.05, size: 3.1, x: 6, y: 5.6, out: t + dur - 0.1 });
  if (extra) extra(w);
  return w;
}

// ---- 1. Cold open ----
scene("Open", 0, 5.2, (s) => {
  line(s, "Design tools got expensive.", { at: 0.3, size: 6.4, x: 8, y: 17, out: 3.0 });
  line(s, "Files got stuck inside them.", { at: 1.5, size: 6.4, x: 8, y: 25, u: "stuck", out: 3.0 });
  mark(s, "insignia.svg", { at: 3.3, x: 43, y: 14, w: 14 });
  mark(s, "wordmark.svg", { at: 3.6, x: 39, y: 30, w: 22 });
  sub(s, "One app for the whole studio. It lives on your computer.", { at: 4.1, x: 30, y: 41.5, size: 2.1, w: 40 });
  sfx(3.3, "soft");
});

// ---- 2. Starts on your computer ----
scene("Home", 5.2, 11.4, (s, at) => {
  chapter(s, "01", "Starts on your computer", at + 0.1);
  line(s, "No account. No upload. Open it and work.", { at: at + 0.2, size: 3.4, x: 6, y: 5.6 });
  shot(s, "home", { at: at + 0.6, focus: [640, 420], zoom: 1.05, dur: 6 });
  callout(s, "<b>This computer.</b> Your files stay on your disk.", 150, 26, 6, 8, { at: at + 1.6 });
  callout(s, "Starter files, so there is something to open on day one.", 760, 300, 12, 9.5, { at: at + 2.8 });
  callout(s, "Design, Board, Slides, Make: one Home for every kind of file.", 1100, 26, -8, 4.5, { at: at + 4.0 });
});

// ---- 3. Design ----
scene("Design", 11.4, 20.8, (s, at) => {
  chapter(s, "02", "Design, with the serious parts", at + 0.1);
  beat(s, "vesta", "A real design file. Ten screens, one investing app.", at + 0.3, 2.6, [740, 460]);
  beat(s, "design-props", "Auto layout. Constraints. Components that follow.", at + 2.9, 2.4, [1300, 520], () => callout(s, "Layout, size and fills of the selected card", 1300, 500, -6, -5.5, { at: at + 3.6, out: at + 5.2 }));
  beat(s, "variables", "Variables, with Light and Dark modes.", at + 5.3, 2.2, [800, 330], () => callout(s, "One value per mode. Switch a frame, everything follows.", 1030, 290, -6, 7, { at: at + 6.0, out: at + 7.4 }));
  const i = shot(s, "inspect", { at: at + 7.5, focus: [1260, 650], zoom: 1.12, dur: 2.4 });
  line(s, "Inspect: code for any layer, in the units your team uses.", { at: at + 7.55, size: 3.1, x: 6, y: 5.6 });
  callout(s, "Layer properties, CSS or any other target", 1260, 690, -7, -5, { at: at + 8.3 });
});

// ---- 4. Prototype → Build as app ----
scene("Build", 20.8, 28.4, (s, at) => {
  chapter(s, "03", "From frames to a working app", at + 0.1);
  beat(s, "prototype", "Wire the flow. Then build the real thing from it.", at + 0.3, 2.8, [760, 460], () => callout(s, "<b>Build as app.</b> The frames go to Make as the starting point.", 1310, 165, -5, 7, { at: at + 1.4, out: at + 3.0 }));
  const m = shot(s, "make-attach", { at: at + 3.2, focus: [220, 740], zoom: 1.1, dur: 4.5 });
  line(s, "Make writes it. With your own key, on any model.", { at: at + 3.25, size: 3.1, x: 6, y: 5.6 });
  callout(s, "The screen, attached from the design file", 60, 683, 8, -7, { at: at + 4.0 });
  callout(s, "Plan first, or build straight away", 130, 855, 10, -4, { at: at + 5.0 });
  callout(s, "Your key. Nothing leaves this machine unless you send it.", 1226, 68, -6, 7, { at: at + 6.0 });
});

// ---- 5. The rest of the studio ----
scene("Studio", 28.4, 41.0, (s, at) => {
  chapter(s, "04", "The rest of the studio, in the same app", at + 0.1);
  beat(s, "slides-deck", "Slides. Real layers, real type, a filmstrip that reorders.", at + 0.3, 2.3, [700, 380]);
  beat(s, "slides-presenter", "Presenter view: next slide, notes, a timer.", at + 2.6, 2.1, [500, 400]);
  beat(s, "board", "Board. A retro with the whole team, names on every note.", at + 4.7, 2.3, [720, 480]);
  beat(s, "campaign-bulk", "Campaign. Paste a spreadsheet, get an asset per row.", at + 7.0, 2.1, [720, 300], () => callout(s, "Five rows in, five posts out", 720, 290, 12, 10, { at: at + 7.7, out: at + 9.0 }));
  beat(s, "sites-publish", "Sites. Three breakpoints, one click to publish.", at + 9.1, 2.1, [560, 260]);
  beat(s, "video", "Video. Tracks, titles, motion presets, MP4 out.", at + 11.2, 1.5, [720, 540]);
});

// ---- 6. Together ----
scene("Together", 41.0, 50.6, (s, at) => {
  beat(s, "document", "Document. Edit a PDF and sign it, right there.", at - 0.2, 2.0, [720, 420]);
  chapter(s, "05", "Together, on a server you choose", at + 1.9);
  beat(s, "comments", "Comments, pinned to the exact pixel.", at + 2.0, 2.2, [640, 400]);
  beat(s, "history", "Named versions, next to the autosaves.", at + 4.2, 2.2, [1300, 300], () => callout(s, "Who changed what, and when", 1300, 250, -6, 8, { at: at + 4.9, out: at + 6.3 }));
  shot(s, "server", { at: at + 6.5, focus: [720, 300], zoom: 1.08, dur: 3.4 });
  line(s, "Share from your laptop. Hosted for free, or run your own.", { at: at + 6.55, size: 3.1, x: 6, y: 5.6 });
  callout(s, "<b>This computer:</b> only you", 530, 195, -5, 7, { at: at + 7.2 });
  callout(s, "<b>Hosted, free:</b> share with anyone", 530, 253, -5, 11, { at: at + 7.8 });
  callout(s, "<b>Your own server:</b> one command on any Linux box", 720, 316, 6, 9, { at: at + 8.4 });
});

// ---- 7. Yours ----
scene("Yours", 50.6, 57.6, (s, at) => {
  chapter(s, "06", "Yours, in every sense", at + 0.1);
  line(s, "Your files, on your disk.", { at: at + 0.3, size: 6.2, x: 8, y: 11 });
  line(s, "Your key, in your keychain.", { at: at + 1.5, size: 6.2, x: 8, y: 19 });
  line(s, "Your copy of the code.", { at: at + 2.7, size: 6.2, x: 8, y: 27, u: "code" });
  sub(s, "MPL-2.0. Fork it, run it, keep it. Nobody counts your seats and nothing waits behind a tier.", { at: at + 4.0, x: 8, y: 37, size: 2.2, w: 60 });
  accent(s, "sh-asterisk", { at: at + 0.6, x: 82, y: 10, size: 9, color: "var(--orange)" });
  accent(s, "sh-sparkle", { at: at + 2.0, x: 74, y: 32, size: 5, color: "var(--pink)" });
  accent(s, "sh-flower", { at: at + 3.2, x: 86, y: 40, size: 7, color: "var(--mint)" });
});

// ---- 8. End ----
scene("End", 57.6, 64, (s, at) => {
  s.style.background = "var(--orange)";
  mark(s, "insignia-cat.svg", { at: at + 0.2, x: 41, y: 5.5, w: 18 });
  mark(s, "wordmark.svg", { at: at + 0.7, x: 37, y: 24.5, w: 26 });
  line(s, "Free, forever.", { at: at + 1.3, size: 5, x: 36.5, y: 37.5, color: "var(--ink)" });
  const b = el("div", "cta", "Download for macOS  →", "left:34cqw;top:45.5cqw"); s.appendChild(b);
  anim(b, [{ opacity: 0, transform: "scale(.8)" }, { opacity: 1, transform: "none" }], { at: at + 2.2, dur: 0.5, ease: "cubic-bezier(.34,1.4,.64,1)" });
  sub(s, "nagma.app", { at: at + 2.8, x: 44.5, y: 53, size: 1.9, color: "var(--ink)" });
  sfx(at + 0.5, "soft"); sfx(at + 2.2, "chime");
});
const DURATION = 64;

// ---- Playback ----
let t = 0, playing = false, muted = false, raf = 0, last = 0;
const rangeEl = document.getElementById("range"), fillEl = document.getElementById("fill"), timeEl = document.getElementById("time"), playBtn = document.getElementById("play"), muteBtn = document.getElementById("mute"), startEl = document.getElementById("start");
rangeEl.max = DURATION;
const fmt = (x) => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, "0")}`;
function seek(x, fromUser = false) {
  t = Math.max(0, Math.min(DURATION, x));
  // Only the chapter on screen is painted (hidden ones still cost paint at opacity 0).
  for (const sc of SCENES) sc.node.style.visibility = sc.at - 0.15 <= t && t < sc.end + 0.15 ? "visible" : "hidden";
  for (const a of ANIMS) a.currentTime = t * 1000;
  rangeEl.value = t; fillEl.style.width = (t / DURATION * 100) + "%"; timeEl.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  document.querySelectorAll("#chapters button").forEach((b, i) => b.classList.toggle("on", SCENES[i].at <= t && t < SCENES[i].end));
  if (fromUser) audio.resync();
}
function tick(now) {
  if (!playing) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  t += dt;
  if (t >= DURATION) { seek(DURATION); pause(); return; }
  seek(t); audio.schedule(t);
  raf = requestAnimationFrame(tick);
}
function play() { if (playing) return; if (t >= DURATION - 0.01) seek(0); playing = true; startEl.style.display = "none"; playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'; playBtn.setAttribute("aria-label", "Pause"); audio.start(t); last = performance.now(); raf = requestAnimationFrame(tick); }
function pause() { if (!playing) return; playing = false; cancelAnimationFrame(raf); audio.stop(); playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>'; playBtn.setAttribute("aria-label", "Play"); }
const toggle = () => (playing ? pause() : play());
playBtn.onclick = toggle; stage.onclick = toggle;
document.getElementById("restart").onclick = () => { seek(0, true); play(); };
rangeEl.oninput = () => seek(+rangeEl.value, true);
muteBtn.onclick = () => setMuted(!muted);
function setMuted(m) { muted = m; audio.setMuted(m); muteBtn.innerHTML = m ? '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 9l5 5m0-5-5 5" stroke="currentColor" stroke-width="2" fill="none"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 8a4.5 4.5 0 0 1 0 8v-2a2.5 2.5 0 0 0 0-4zM16 4a8 8 0 0 1 0 16v-2a6 6 0 0 0 0-12z"/></svg>'; muteBtn.setAttribute("aria-label", m ? "Unmute" : "Mute"); }
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.key !== " ") return;
  const big = e.shiftKey ? 10 : 2;
  if (e.key === " ") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); seek(t + big, true); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); seek(t - big, true); }
  else if (e.key === "Home") seek(0, true);
  else if (e.key === "End") seek(DURATION - 0.01, true);
  else if (e.key.toLowerCase() === "m") setMuted(!muted);
  else if (/^[0-9]$/.test(e.key)) seek(DURATION * (+e.key) / 10, true);
});
const chapters = document.getElementById("chapters");
SCENES.forEach((sc) => { const b = el("button", "", `${sc.name} <span style="opacity:.6">${fmt(sc.at)}</span>`); b.onclick = () => { seek(sc.at + 0.02, true); if (!playing) play(); }; chapters.appendChild(b); });
const trackEl = document.querySelector(".track");
SCENES.forEach((sc) => { if (sc.at) trackEl.appendChild(el("em", "", "", `left:${sc.at / DURATION * 100}%`)); });

// ---- Sound: a synthesised soundtrack and a few quiet effects, scheduled on the same clock ----
const audio = (() => {
  let ctx = null, master = null, music = null, fx = null, base = 0, step = 0, fxIndex = 0, running = false, noise = null;
  const BPM = 118, STEP = 60 / BPM / 4;
  const N = (n) => 440 * Math.pow(2, (n - 69) / 12);
  const ensure = () => { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ctx.destination); music = ctx.createGain(); music.gain.value = 0.5; music.connect(master); fx = ctx.createGain(); fx.gain.value = 0.45; fx.connect(master); };
  const noiseBuf = () => { const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
  const env = (g, at, a, d, peak = 1) => { g.gain.cancelScheduledValues(at); g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(peak, at + a); g.gain.exponentialRampToValueAtTime(0.0001, at + a + d); };
  const osc = (type, f, at, len, out, { a = 0.005, d = 0.2, peak = 0.3, slide = null, filter = null } = {}) => { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, at); if (slide) o.frequency.exponentialRampToValueAtTime(slide, at + len); const g = ctx.createGain(); env(g, at, a, d, peak); o.connect(g); if (filter) { const fl = ctx.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = filter; g.connect(fl); fl.connect(out); } else g.connect(out); o.start(at); o.stop(at + len + 0.05); };
  const burst = (at, len, out, { hp = 1000, lp = 12000, peak = 0.4, d = 0.08 } = {}) => { noise ||= noiseBuf(); const src = ctx.createBufferSource(); src.buffer = noise; const h = ctx.createBiquadFilter(); h.type = "highpass"; h.frequency.value = hp; const l = ctx.createBiquadFilter(); l.type = "lowpass"; l.frequency.value = lp; const g = ctx.createGain(); env(g, at, 0.002, d, peak); src.connect(h); h.connect(l); l.connect(g); g.connect(out); src.start(at); src.stop(at + len + 0.05); };
  const kick = (at) => osc("sine", 140, at, 0.3, music, { d: 0.26, peak: 0.8, slide: 42 });
  const snare = (at) => { burst(at, 0.2, music, { hp: 1800, peak: 0.28, d: 0.12 }); osc("triangle", 180, at, 0.15, music, { d: 0.1, peak: 0.2, slide: 110 }); };
  const hat = (at, open = false) => burst(at, open ? 0.25 : 0.06, music, { hp: 7500, peak: open ? 0.12 : 0.09, d: open ? 0.18 : 0.04 });
  const bass = (at, n, len) => osc("sawtooth", N(n), at, len, music, { d: len * 0.9, peak: 0.24, filter: 650 });
  const pluck = (at, n) => osc("triangle", N(n), at, 0.4, music, { d: 0.35, peak: 0.15 });
  const pad = (at, ns, len = 1.8) => ns.forEach((n) => osc("triangle", N(n), at, len, music, { a: 0.08, d: len * 0.9, peak: 0.05 }));
  const stab = (at, ns) => ns.forEach((n) => osc("square", N(n), at, 0.22, music, { d: 0.18, peak: 0.05, filter: 2000 }));
  // D major, a loop of four: D, A, Bm, G.
  const CH = [[62, 66, 69, 73], [57, 61, 64, 69], [59, 62, 66, 69], [55, 59, 62, 67]];
  const ARP = [[74, 78, 81, 86], [69, 73, 76, 81], [71, 74, 78, 81], [67, 71, 74, 79]];
  const section = (tt) => (tt < 5.2 ? 0 : tt < 50.6 ? 1 : tt < 57.6 ? 2 : 3);
  const atStep = (i, when) => {
    const bar = Math.floor(i / 16), s16 = i % 16, chord = CH[bar % 4], arp = ARP[bar % 4], sec = section(i * STEP);
    if (sec === 0) { if (s16 === 0) pad(when, chord, 1.9); if (s16 % 4 === 2) pluck(when, arp[(s16 >> 2) % 4]); }
    else if (sec === 1) {
      if (s16 === 0 || s16 === 7 || s16 === 8 || s16 === 14) kick(when);
      if (s16 === 4 || s16 === 12) snare(when);
      if (s16 % 2 === 0) hat(when, s16 === 10);
      if (s16 % 4 === 0 || s16 === 6 || s16 === 14) bass(when, chord[0] - 24, STEP * 1.8);
      if (s16 === 0 || s16 === 10) stab(when, chord);
      if ([2, 5, 9, 13].includes(s16)) pluck(when, arp[(s16 + bar) % 4]);
      if (s16 === 0 && bar % 2) pad(when, chord.map((n) => n + 12), 1.6);
    } else if (sec === 2) { if (s16 === 0) { kick(when); pad(when, chord, 2.0); bass(when, chord[0] - 24, STEP * 6); } if (s16 === 8) hat(when, true); if (s16 % 4 === 2) pluck(when, arp[(s16 >> 2) % 4] + 12); }
    else { if (s16 === 0 && bar % 2 === 0) { kick(when); pad(when, chord.map((n) => n + 12), 2.4); bass(when, chord[0] - 24, STEP * 8); } if (s16 % 4 === 2) pluck(when, arp[(s16 >> 2) % 4] + 12); }
  };
  const effects = {
    tick: (w) => osc("sine", 1400, w, 0.05, fx, { d: 0.04, peak: 0.12 }),
    blip: (w) => osc("sine", 880, w, 0.09, fx, { d: 0.08, peak: 0.16, slide: 1320 }),
    whoosh: (w) => burst(w, 0.35, fx, { hp: 500, lp: 3500, peak: 0.16, d: 0.3 }),
    soft: (w) => osc("sine", N(74), w, 0.6, fx, { a: 0.02, d: 0.5, peak: 0.12 }),
    chime: (w) => { osc("sine", N(86), w, 0.9, fx, { d: 0.8, peak: 0.18 }); osc("sine", N(93), w + 0.08, 0.9, fx, { d: 0.8, peak: 0.12 }); },
  };
  SFX.sort((a, b) => a[0] - b[0]);
  const LOOK = 0.25;
  function start(at) { ensure(); if (ctx.state === "suspended") ctx.resume(); base = ctx.currentTime - at; step = Math.ceil(at / STEP); fxIndex = SFX.findIndex(([x]) => x >= at); if (fxIndex < 0) fxIndex = SFX.length; running = true; schedule(at); }
  function schedule(now) {
    if (!running) return;
    while (step * STEP < now + LOOK && step * STEP < DURATION) { atStep(step, Math.max(ctx.currentTime, base + step * STEP)); step++; }
    while (fxIndex < SFX.length && SFX[fxIndex][0] < now + LOOK) { const [when, kind] = SFX[fxIndex++]; effects[kind]?.(Math.max(ctx.currentTime, base + when)); }
  }
  function stop() { running = false; }
  function resync() { if (running) start(t); }
  function setMuted(m) { if (master) master.gain.setTargetAtTime(m ? 0 : 0.9, ctx.currentTime, 0.02); }
  return { start, schedule, stop, resync, setMuted };
})();

seek(0);
startEl.onclick = (e) => { e.stopPropagation(); play(); };
</script>
