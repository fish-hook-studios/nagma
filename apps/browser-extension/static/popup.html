<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Nagma Capture</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <header>
        <img src="icons/icon-32.png" width="20" height="20" alt="" />
        <h1>Nagma Capture</h1>
    </header>
    <button id="capture" class="primary">Capture this page</button>
    <p class="hint"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> captures the page you're on.</p>
    <button id="download" class="secondary">Download capture</button>
    <p id="status" role="status" aria-live="polite"></p>
    <details>
        <summary>Options</summary>
        <label for="address">Send to</label>
        <select id="address">
            <option value="https://api.nagma.app">Nagma (api.nagma.app)</option>
            <option value="http://localhost:5310">This computer (localhost:5310)</option>
            <option value="custom">Another address…</option>
        </select>
        <input id="custom" type="url" placeholder="https://nagma.example.com" hidden />
        <label class="check disabled">
            <input id="states" type="checkbox" disabled />
            Include hover and focus states <span class="soon">Coming soon</span>
        </label>
    </details>
    <p class="privacy">Captures stay in this browser until you send or save one. No account needed.</p>
    <script src="popup.js"></script>
</body>
</html>
