<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dialog · Lumen</title>
<link rel="stylesheet" href="fonts.css">
<style>
body { margin: 0; font-family: "Source Sans 3", sans-serif; background: #101828; color: #fff; }
main { padding: 56px; }
.cta { width: 720px; height: 420px; padding: 40px; border-radius: 20px; background: linear-gradient(135deg, #4f46e5, #7c3aed); box-sizing: border-box; position: relative; }
.cta h1 { margin: 0 0 12px; font-size: 40px; }
.cta p { margin: 0 0 24px; font-size: 18px; color: #e0e7ff; }
.open { padding: 12px 22px; border: 0; border-radius: 10px; background: #fff; color: #3730a3; font: 700 16px "Source Sans 3", sans-serif; cursor: pointer; }
dialog { width: 360px; border: 0; border-radius: 16px; padding: 24px; color: #101828; box-shadow: 0 24px 64px rgba(0, 0, 0, .35); }
dialog::backdrop { background: rgba(16, 24, 40, .6); }
dialog h2 { margin: 0 0 8px; }
dialog input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin: 12px 0; border: 1px solid #d0d5dd; border-radius: 8px; font: 16px "Source Sans 3", sans-serif; }
.row { display: flex; justify-content: flex-end; gap: 8px; }
.row button { padding: 10px 16px; border-radius: 8px; border: 0; font: 600 15px "Source Sans 3", sans-serif; }
.close { background: #f2f4f7; color: #344054; }
.join { background: #4f46e5; color: #fff; }
</style></head>
<body><main>
<section class="cta">
  <h1>Join the beta</h1>
  <p>Get Lumen before everyone else, and tell us what to build next.</p>
  <button class="open" data-dialog="signup">Sign me up</button>
  <dialog id="signup">
    <h2>Sign up</h2>
    <p style="color:#475467;margin:0">We'll send one email when it's ready.</p>
    <input type="email" placeholder="you@example.com">
    <div class="row"><button class="close" aria-label="Close">Not now</button><button class="join">Join</button></div>
  </dialog>
</section>
</main>
<script>
const d = document.getElementById("signup");
document.querySelector("[data-dialog]").addEventListener("click", () => d.showModal());
d.querySelector(".close").addEventListener("click", () => d.close());
</script>
</body></html>
