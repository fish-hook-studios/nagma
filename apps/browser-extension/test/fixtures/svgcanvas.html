<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Status · Relay</title>
<link rel="stylesheet" href="fonts.css">
<style>
body { margin: 0; font-family: "Source Sans 3", sans-serif; background: #f8fafc; color: #0f172a; }
header { display: flex; align-items: center; gap: 12px; padding: 16px 40px; background: #fff; border-bottom: 1px solid #e2e8f0; }
header .name { font-weight: 700; font-size: 20px; }
header .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: #15803d; font-weight: 600; }
.icon { width: 18px; height: 18px; color: #15803d; }
main { padding: 32px 40px; display: flex; gap: 24px; align-items: flex-start; }
.chart { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 4px 12px rgba(15,23,42,.06); }
.chart h2 { margin: 0 0 12px; font-size: 17px; }
.side { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.svc { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #fff; border-radius: 12px; box-shadow: 0 4px 12px rgba(15,23,42,.06); }
.svc .icon.warn { color: #d97706; }
.promo { position: relative; padding: 24px; border-radius: 14px; color: #fff; background: radial-gradient(circle at 20% 20%, #38bdf8, #6366f1 60%, #312e81); overflow: hidden; }
.promo h3 { margin: 0 0 6px; font-size: 20px; }
.ribbon { position: absolute; right: -34px; top: 18px; transform: rotate(45deg); background: #f59e0b; color: #111; font-weight: 700; font-size: 12px; padding: 4px 40px; }
</style></head>
<body>
<header>
<svg width="32" height="32" viewBox="0 0 32 32" aria-label="Relay logo"><rect width="32" height="32" rx="8" fill="#0ea5e9"/><path d="M9 22 L16 9 L23 22 Z" fill="#fff"/><circle cx="16" cy="18" r="2.5" fill="#0ea5e9"/></svg>
<span class="name">Relay status</span>
<span class="status"><svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm3.7 6.3-4.5 4.5a1 1 0 0 1-1.4 0l-2-2 1.4-1.4 1.3 1.3 3.8-3.8 1.4 1.4Z"/></svg>All systems normal</span>
</header>
<main>
<div class="chart"><h2>Requests per minute</h2><canvas id="c" width="520" height="220"></canvas></div>
<div class="side">
<div class="svc"><svg class="icon" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="7"/></svg>API gateway</div>
<div class="svc"><svg class="icon" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="7"/></svg>Webhooks</div>
<div class="svc"><svg class="icon warn" viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="7"/></svg>Search index (slow)</div>
<div class="promo"><span class="ribbon">BETA</span><h3>Regional failover</h3><p>Traffic moves to the nearest healthy region in under a second.</p></div>
</div>
</main>
<script>
const c = document.getElementById("c"), g = c.getContext("2d");
g.fillStyle = "#fff"; g.fillRect(0, 0, 520, 220);
g.strokeStyle = "#e2e8f0"; g.lineWidth = 1;
for (let y = 20; y <= 200; y += 45) { g.beginPath(); g.moveTo(0, y); g.lineTo(520, y); g.stroke(); }
const pts = [120, 140, 110, 160, 150, 180, 170, 130, 150, 190, 175, 200, 185];
g.beginPath(); pts.forEach((v, i) => { const x = i * 43, y = 220 - v; i ? g.lineTo(x, y) : g.moveTo(x, y); });
g.strokeStyle = "#6366f1"; g.lineWidth = 3; g.stroke();
g.lineTo(516, 220); g.lineTo(0, 220); g.closePath(); g.fillStyle = "rgba(99,102,241,.12)"; g.fill();
</script>
</body></html>
