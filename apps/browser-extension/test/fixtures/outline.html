<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Outlined type · Studio</title>
<link rel="stylesheet" href="fonts.css">
<style>
body { margin: 0; font-family: "Source Serif 4", serif; background: #f4efe6; color: #1f1a17; }
.hero { padding: 64px; text-align: center; }
h1 { font-size: 112px; line-height: 1; margin: 0; font-weight: 700; text-transform: uppercase; }
.outline { color: transparent; -webkit-text-stroke: 2px #1f1a17; }
.big { font-size: 140px; font-weight: 700; color: transparent; -webkit-text-stroke: 3px #e4572e; margin: 24px 0 0; line-height: 1; }
p { font: 20px "Source Sans 3", sans-serif; color: #475467; }
</style></head>
<body><section class="hero">
<h1>Make <span class="outline">any</span>thing.</h1>
<div class="big">OUTLINE</div>
<p>Text drawn as an outline, a word at a time or all of it.</p>
</section></body></html>
