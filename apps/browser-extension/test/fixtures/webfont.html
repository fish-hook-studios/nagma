<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Web font · Studio</title>
<style>
/* A typeface Nagma doesn't ship and the web font service doesn't have (OFL, see webfont/OFL-Absans.txt). */
@font-face { font-family: "Absans"; src: url("webfont/Absans-Regular.woff2") format("woff2"); font-weight: 400; }
body { margin: 0; font-family: "Absans", sans-serif; background: #f4efe6; color: #1f1a17; }
main { padding: 72px 64px; }
h1 { font-size: 72px; line-height: 1.05; font-weight: 400; margin: 0 0 24px; letter-spacing: -0.02em; }
p { font-size: 22px; line-height: 1.5; max-width: 720px; margin: 0 0 16px; }
.tag { display: inline-block; padding: 8px 16px; border-radius: 999px; background: #1f1a17; color: #f4efe6; font-size: 16px; }
</style></head>
<body><main>
<span class="tag">A typeface of its own</span>
<h1>Type that only this page has</h1>
<p>The capture brings the page's own font files along, so the text in Nagma is set in the same typeface instead of a stand-in.</p>
<p>They stay on this device, in this browser, and nowhere else.</p>
</main></body></html>
