# Weekly dependency updates, one grouped pull request per app (security updates still come at once).
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/server
    schedule:
      interval: weekly
    groups:
      server:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      desktop:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directories: [/apps/mcp, /apps/vscode-extension]
    schedule:
      interval: weekly
    groups:
      tools:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
