[package]
name = "nagma-photo"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "PhotoCraft's engine compiled to WebAssembly for Nagma's photo layers."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
photocraft-engine = { path = "../photocraft/crates/engine" }
photocraft-io = { path = "../photocraft/crates/io" }
photocraft-compose = { path = "../photocraft/crates/compose" }
photocraft-doc = { path = "../photocraft/crates/doc" }
wasm-bindgen = "0.2"
serde_json = "1"

# Its own workspace, so cargo doesn't look for one in parent folders.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
