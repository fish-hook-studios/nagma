[package]
name = "nagma-motion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "EffectCraft's effects, Lottie reader and FilmCraft's encoders compiled to WebAssembly for Nagma's motion export and video editor."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
effectcraft-effects = { path = "../effectcraft/crates/effects" }
effectcraft-keyframe = { path = "../effectcraft/crates/keyframe" }
effectcraft-lottie = { path = "../effectcraft/crates/lottie" }
effectcraft-project = { path = "../effectcraft/crates/project" }
filmcraft-h264enc = { path = "../filmcraft/crates/h264enc" }
filmcraft-isobmff = { path = "../filmcraft/crates/isobmff" }
gif = "0.14"
wasm-bindgen = "0.2"
serde_json = "1"

# Its own workspace, so cargo doesn't look for one in parent folders.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# EffectCraft pins FilmCraft from GitHub; build against the private mirror checked out here.
[patch."https://github.com/storytold/filmcraft"]
filmcraft-h264enc = { path = "../filmcraft/crates/h264enc" }
filmcraft-isobmff = { path = "../filmcraft/crates/isobmff" }
