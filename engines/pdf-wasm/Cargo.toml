[package]
name = "nagma-pdf"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "PdfCraft's engine compiled to WebAssembly for Nagma's PDF pages and Document files."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfcraft-cos = { path = "../pdfcraft/crates/cos" }
pdfcraft-organize = { path = "../pdfcraft/crates/organize" }
pdfcraft-render = { path = "../pdfcraft/crates/render" }
pdfcraft-engine = { path = "../pdfcraft/crates/engine" }
hayro = "0.7.1"
kurbo = "0.13"
smallvec = "1"
wasm-bindgen = "0.2"
serde_json = "1"

# Its own workspace, so cargo doesn't look for one in parent folders.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The same patched crates PdfCraft builds with.
[patch.crates-io]
hayro-interpret = { path = "../pdfcraft/vendor/hayro-interpret" }
hayro = { path = "../pdfcraft/vendor/hayro" }
hayro-syntax = { path = "../pdfcraft/vendor/hayro-syntax" }
hayro-jbig2 = { path = "../pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "../pdfcraft/vendor/lopdf" }
