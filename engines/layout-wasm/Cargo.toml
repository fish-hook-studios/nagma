[package]
name = "nagma-layout"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DesignCraft's layout engine compiled to WebAssembly for Nagma's page layouts."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
designcraft-engine = { path = "../designcraft/crates/engine" }
designcraft-doc = { path = "../designcraft/crates/doc" }
designcraft-geom = { path = "../designcraft/crates/geom" }
designcraft-color = { path = "../designcraft/crates/color" }
designcraft-compose = { path = "../designcraft/crates/compose" }
designcraft-render = { path = "../designcraft/crates/render" }
designcraft-idml = { path = "../designcraft/crates/idml" }
designcraft-format = { path = "../designcraft/crates/format" }
wasm-bindgen = "0.2"
serde_json = "1"

# Its own workspace, so cargo doesn't look for one in parent folders.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
